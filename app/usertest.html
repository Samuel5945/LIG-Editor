<!doctype html>
<html>
  <head><meta charset="utf-8" /></head>
  <body style="user-select: none">
    <textarea id="t" rows="3" cols="30"></textarea>
    <input id="i" />
    <pre id="log"></pre>
    <script>
      const t = document.getElementById('t')
      const log = document.getElementById('log')
      const lines = []
      t.addEventListener('keydown', (e) => lines.push(`keydown key=${e.key} isComposing=${e.isComposing} keyCode=${e.keyCode}`))
      t.addEventListener('input', () => lines.push(`input value=${JSON.stringify(t.value)}`))
      t.addEventListener('focus', () => lines.push('focus'))
      window.state = () => ({
        activeTag: document.activeElement.tagName,
        computedUserSelect: getComputedStyle(t).userSelect,
        value: t.value,
        selectionStart: t.selectionStart,
        log: lines
      })
    </script>
  </body>
</html>
