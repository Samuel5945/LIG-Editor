# electron-builder 打包配置（M9）
# - extraResources 把 mcp-proxy.cjs 带到 <exe目录>/resources/：
#   ipc.ts buildAccessCard 与 proxy 自身的打包态路径推导都依赖这一约定
# - NSIS 默认按用户安装（AppData\Local\Programs），exe 同级目录可写，
#   workspace/skills/settings 落在 exe 旁边（paths.ts resolveRoot）
# - portable 版运行时解压临时目录，paths.ts 用 PORTABLE_EXECUTABLE_DIR 定位真实目录；
#   MCP 接入建议用安装版（portable 的 execPath 每次运行都在临时目录，接入卡片路径不稳定）
appId: com.lig.editor
productName: 立格编辑器
directories:
  # NSIS 要求纯 ASCII 输出路径（中文路径会被 GBK 转码搞乱 Can't open output file），
  # 本地工程目录名 tuwen-editor 不变（改名只动应用标识），输出仍放工程根的 releases
  output: C:/Users/PC/Desktop/tuwen-editor/releases
files:
  - out/**
  - package.json
extraResources:
  - from: resources/mcp-proxy.cjs
    to: mcp-proxy.cjs
  # 预装 Skill：首启时由主进程种子复制到 <root>/skills（不覆盖用户已有目录）
  - from: resources/skills
    to: skills
asarUnpack:
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"
win:
  # 圆角矩形应用图标（scripts/make-icon.mjs 生成），builder 自动转多尺寸 ico 嵌入 exe
  icon: build/icon.png
  target:
    - nsis
    - portable
  artifactName: "LIG-Editor-${version}-${arch}.${ext}"
nsis:
  # 向导式安装：可选安装目录、有确认页（oneClick 会无反馈直接装进 AppData）
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  artifactName: "LIG-Editor-setup-${version}.${ext}"
  shortcutName: 立格编辑器
  # 自定义安装脚本：customInit 里自动关闭运行中的旧版应用（exe 被占用会阻止覆盖升级）
  include: build/installer.nsh
portable:
  artifactName: "LIG-Editor-portable-${version}.exe"
